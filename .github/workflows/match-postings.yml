name: 지원사업 매칭 알리미

on:
  schedule:
    # 5일마다 00:00 UTC (한국시간 오전 9시)
    - cron: "0 0 */5 * *"
  workflow_dispatch: {}

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 매칭 스크립트 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          INGEST_URL: https://hyetaek-hub.vercel.app/api/postings/ingest
        run: python scripts/match_postings.py

      - name: 로그 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/
          git diff --staged --quiet || git commit -m "chore: 지원사업 매칭 로그 추가"
          git push
